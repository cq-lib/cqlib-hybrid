name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m unittest discover -s tests

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine pytest pyyaml requests
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel using the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/cqlib-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/cqlib-sdist"
          cd "$RUNNER_TEMP"/cqlib-sdist/cqlib_hybrid-*
          python -m pytest
